version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/aspee-pharma"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Security-fix PRs for known vulnerabilities are opened by Dependabot
    # regardless of this schedule/limit — those aren't throttled. This
    # config governs routine version-bump PRs, grouped to keep the PR list
    # manageable rather than one PR per package.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
